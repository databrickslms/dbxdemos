[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "databricks360"
version = "0.4.0"
description = "Install Databricks course lab environments: notebooks, catalogs, datasets and governance objects."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lakehouse Academy" }]
keywords = ["databricks", "training", "genie", "unity-catalog", "lakehouse"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = ["databricks-sdk>=0.38.0"]

[project.urls]
Homepage = "https://github.com/databrickslms/dbxdemos"
Source = "https://github.com/databrickslms/dbxdemos"
Issues = "https://github.com/databrickslms/dbxdemos/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["databricks360"]
